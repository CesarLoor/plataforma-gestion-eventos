name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  imagenes:
    name: Imagen ${{ matrix.servicio }} + Trivy
    needs: calidad
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [auth, catalog, inventory, orders, payment-sim, tickets, checkin, notifications, reports, pwa]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: |
          if [ "${{ matrix.servicio }}" = "pwa" ]; then
            docker build -f apps/pwa/Dockerfile -t plataforma/pwa:${{ github.sha }} .
          else
            docker build -f infra/Dockerfile.servicio --build-arg SERVICIO=${{ matrix.servicio }} -t plataforma/${{ matrix.servicio }}:${{ github.sha }} .
          fi
      - name: Escanear con Trivy (falla con CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: plataforma/${{ matrix.servicio }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  e2e:
    name: Concurrencia y flujo completo
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/generar-env.mjs
      - run: docker compose up -d --build --wait
      - run: docker compose --profile pruebas run --rm pruebas
      - if: failure()
        run: docker compose logs --tail=80

  # Preparado pero sin ejecutar: requiere los secretos AWS_ROLE_ARN y EC2_INSTANCE_ID, y el .env ya creado en el servidor.
  desplegar:
    name: Desplegar en EC2
    if: github.event_name == 'workflow_dispatch' && vars.DESPLIEGUE_HABILITADO == 'true'
    needs: [imagenes, e2e, secretos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Copiar código y levantar con docker compose (SSH por EC2 Instance Connect Endpoint)
        env:
          INSTANCIA: ${{ secrets.EC2_INSTANCE_ID }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 600 /dev/null clave.pem && printf '%s\n' "$SSH_KEY" > clave.pem
          SSH="ssh -i clave.pem -o StrictHostKeyChecking=accept-new -o ProxyCommand='aws ec2-instance-connect open-tunnel --instance-id $INSTANCIA' ubuntu@$INSTANCIA"
          git archive HEAD | eval "$SSH 'tar -x -C /opt/plataforma-eventos'"
          eval "$SSH 'cd /opt/plataforma-eventos && docker compose up -d --build --remove-orphans'"
          rm -f clave.pem
